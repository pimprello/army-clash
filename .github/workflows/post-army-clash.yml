name: Post Army Clash

on:
  schedule:
    # Every 15 minutes: 96 Shorts a day, just under YouTube's API limit of 100 uploads a day per project.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      privacy:
        description: 'Who can see the video'
        type: choice
        options: [public, unlisted, private]
        default: public

permissions:
  contents: write

concurrency:
  group: post-army-clash
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - run: npm ci

      - name: Make the video (60 s, 1080x1920, 60 fps, sound)
        run: node render.js

      - name: Upload to YouTube
        run: node upload.js
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY: ${{ inputs.privacy || 'public' }}

      - name: Add it to uploads.md
        run: |
          node log-upload.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uploads.md
          git commit -q -m "Posted: $(node -p "require('./out/uploaded.json').title")"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

      - name: Keep the video if the upload failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: army-clash-video
          path: out/
          retention-days: 3
