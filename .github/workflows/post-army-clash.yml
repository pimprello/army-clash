name: Post Army Clash

on:
  schedule:
    # Every 5 minutes. YouTube's API allows 100 uploads a day per project, so runs fail once that is reached.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      privacy:
        description: 'Who can see the video'
        type: choice
        options: [public, unlisted, private]
        default: public

permissions:
  contents: write
  actions: write

concurrency:
  group: post-army-clash
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Note the start time
        run: echo "START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - run: npm ci

      - name: Make the video (60 s, 1080x1920, 60 fps, sound)
        run: node render.js

      - name: Upload to YouTube
        run: node upload.js
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY: ${{ inputs.privacy || 'public' }}

      - name: Add it to uploads.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=0
          for i in 1 2 3; do
            # Start from the latest main every time, so an older checkout can't cause a merge conflict.
            git fetch -q origin main
            git checkout -q -B main origin/main
            node log-upload.js
            git add uploads.md
            git commit -q -m "Posted: $(node -p "require('./out/uploaded.json').title")" || true
            if git push -q origin main; then pushed=1; break; fi
            sleep 5
          done
          test "$pushed" = 1 || { echo "Could not record the upload in uploads.md"; exit 1; }

      - name: Keep the video if the upload failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: army-clash-video
          path: out/
          retention-days: 3

      # GitHub's schedule timer is unreliable, so each run queues the next one itself.
      # If several runs end up queued, the concurrency group keeps only the newest.
      - name: Queue the next post in 5 minutes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wait=$(( 300 - ($(date +%s) - START) ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          gh api -X POST "repos/${{ github.repository }}/actions/workflows/post-army-clash.yml/dispatches" -f ref=main -f 'inputs[privacy]=public'
